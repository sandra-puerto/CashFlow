server {
    listen 80;                              # NGINX escuchará en el puerto 80 (HTTP)
    server_name cashflow-demo.local;        # Nombre de dominio/host para este server block

    root /app/public;                       # Directorio raíz del proyecto (Laravel usa /public)

    index index.php index.html;             # Archivos que se buscan por defecto al entrar en un directorio

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        # "try_files":
        # 1. Busca si existe el archivo solicitado ($uri).
        # 2. Si no, intenta ver si es un directorio ($uri/).
        # 3. Si nada de lo anterior existe, reenvía la petición a index.php
        #    con los parámetros de la query (?a=1&b=2).
        # Esto es clave en Laravel para manejar las rutas con el Router.
    }

    location ~ \.php$ {
        include fastcgi_params;             # Carga configuración estándar de FastCGI
        fastcgi_pass cashflow-demo:9000;    # Redirige a PHP-FPM (contenedor + puerto)
        fastcgi_index index.php;            # Archivo por defecto si solo accedemos a un directorio
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # SCRIPT_FILENAME: le dice a PHP-FPM cuál archivo ejecutar
        #   $document_root = /app/public
        #   $fastcgi_script_name = archivo solicitado (.php)
        #   Ejemplo: /app/public/index.php
    }

    location ~ /\.ht {
        deny all;
        # Seguridad: niega acceso a archivos ocultos tipo .htaccess o .htpasswd
        # porque son de Apache y no deben ser expuestos nunca en producción
    }

    error_log  /var/log/nginx/error.log;    # Log de errores de NGINX
    access_log /var/log/nginx/access.log;   # Log de accesos
}

